name: Finalize verified intro

on:
  workflow_run:
    workflows:
      - Intro contract v2
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'feature/first-visit-assembly'
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove temporary test infrastructure from main
        run: |
          rm -f \
            .github/workflows/intro-filmstrip.yml \
            .github/workflows/intro-contract.yml \
            .github/workflows/intro-contract-v2.yml \
            .github/workflows/intro-contract-diagnostic.yml \
            .github/workflows/apply-intro-polish.yml \
            .github/workflows/finalize-verified-intro.yml

          git config user.name 'Studio Wievien verification bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Remove temporary intro test infrastructure'
          git push origin main

      - name: Clean the verified feature branch
        run: |
          git fetch origin feature/first-visit-assembly
          git switch --force-create feature/first-visit-assembly origin/feature/first-visit-assembly

          rm -f \
            site/.intro-filmstrip-trigger \
            site/.intro-contract-trigger \
            site/.intro-contract-v2-trigger \
            site/.intro-diagnostic-trigger \
            site/.fix-intro-contract-trigger \
            site/.title-direction-trigger \
            site/.title-impact-trigger \
            site/.finalize-title-intro-trigger \
            .github/workflows/apply-intro-polish.yml \
            .github/workflows/apply-title-direction.yml \
            .github/workflows/apply-title-impact.yml \
            .github/workflows/finalize-title-intro.yml \
            .github/workflows/fix-intro-contract.yml \
            .github/scripts/apply-title-impact.py \
            .github/scripts/finalize-title-intro.py \
            .github/scripts/fix-intro-contract.py

          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Remove temporary intro test triggers'
          git push origin feature/first-visit-assembly

      - name: Mark the pull request verified
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'Automated intro verification passed.',
              '',
              '- desktop and mobile build',
              '- complete performance cleanup',
              '- repeat-visit behavior',
              '- wheel/tap/keyboard dismissal',
              '- resize fallback',
              '- reduced-motion behavior',
              '- JavaScript-disabled fallback',
              '- semantic title and decorative motion layers',
              '- horizontal overflow and browser-error checks',
              '',
              `Verification run: ${context.payload.workflow_run.html_url}`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 14,
              body,
            });

  report-failure:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'feature/first-visit-assembly'
    runs-on: ubuntu-latest

    steps:
      - name: Report failed verification on the pull request
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 14,
              body: `Automated intro verification failed. The experimental branch and test rigs were deliberately left intact for repair.\n\nRun: ${context.payload.workflow_run.html_url}`,
            });
