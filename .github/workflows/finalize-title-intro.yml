name: Finalize title intro

on:
  push:
    branches:
      - feature/first-visit-assembly
    paths:
      - 'site/.finalize-title-intro-trigger'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest

    steps:
      - name: Check out intro branch
        uses: actions/checkout@v4
        with:
          ref: feature/first-visit-assembly
          fetch-depth: 0

      - name: Apply final structure and interaction edits
        run: python3 .github/scripts/finalize-title-intro.py

      - name: Commit finalization
        run: |
          git config user.name 'Studio Wievien motion bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize title intro interaction and structure'
          git push origin HEAD:feature/first-visit-assembly
