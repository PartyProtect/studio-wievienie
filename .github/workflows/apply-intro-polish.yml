name: Apply intro polish

on:
  push:
    branches:
      - feature/first-visit-assembly
    paths:
      - 'site/.intro-polish-patch'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out animation branch
        uses: actions/checkout@v4
        with:
          ref: feature/first-visit-assembly
          fetch-depth: 0

      - name: Apply verified source edits
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          title_path = Path('site/src/scripts/title-entrance.js')
          title = title_path.read_text()
          title = replace_once(title, '      const direction = index % 2 === 0 ? -1 : 1;', '      const direction = -1;', 'impact direction')
          title = replace_once(
              title,
              "          { offset: 0.3, transform: `translate(${direction * force}px, -1px) rotate(${direction * force * 0.1}deg)` },",
              "          { offset: 0.3, transform: `translate(${direction * force}px, ${-Math.min(3.2, 0.6 + force * 0.18)}px) rotate(${direction * force * 0.085}deg) scale(${1 + force * 0.004}, ${1 - force * 0.006})` },",
              'impact peak pose',
          )
          title = replace_once(
              title,
              "    later(() => {\n      reactToImpact(scene, [2, 1, 0], (index, order) => 4 - order, 320, 28);\n    }, 5350);",
              "    later(() => {\n      reactToImpact(scene, [2, 1, 0], (index, order) => 8.5 - order * 1.5, 430, 42);\n    }, 5340);",
              'v impact',
          )
          title = replace_once(
              title,
              "    later(() => {\n      reactToImpact(scene, [5, 4, 3, 2, 1, 0], (index, order) => Math.max(1.2, 7 - order * 0.9), 330, 34);\n    }, 7050);",
              "    later(() => {\n      reactToImpact(scene, [5, 4, 3, 2, 1, 0], (index, order) => Math.max(3, 12.5 - order * 1.6), 460, 42);\n    }, 7000);",
              'n collision wave',
          )
          title = replace_once(title, '    }, 7450);', '    }, 7660);', 'collective settle timing')
          title = replace_once(title, '    }, 7680);', '    }, 7920);', 'title handoff timing')
          title = replace_once(title, '      setCompletionTimer(10700);', '      setCompletionTimer(10100);', 'intro completion timing')
          title_path.write_text(title)

          css_path = Path('site/src/styles/title-entrance.css')
          css = css_path.read_text()
          css = replace_once(css, '  color: rgb(23 23 22 / 0.11);', '  color: rgb(23 23 22 / 0.12);', 'cast density')
          css = replace_once(css, '  background: rgb(23 23 22 / 0.34);', '  background: rgb(23 23 22 / 0.4);', 'contact density')
          css = replace_once(css, '  filter: blur(5.5px);', '  filter: blur(4.8px);', 'contact sharpness')
          css_path.write_text(css)

          Path('site/.intro-polish-patch').unlink()
          PY

      - name: Commit polished choreography
        run: |
          git config user.name 'Studio Wievien motion bot'
          git config user.email 'actions@users.noreply.github.com'
          git add site/src/scripts/title-entrance.js site/src/styles/title-entrance.css site/.intro-polish-patch
          git commit -m 'Strengthen title impacts and floor shadows'
          git push origin HEAD:feature/first-visit-assembly
