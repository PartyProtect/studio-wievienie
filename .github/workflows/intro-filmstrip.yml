name: Intro filmstrip

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'site/**'
      - '.github/workflows/intro-filmstrip.yml'

permissions:
  contents: read

jobs:
  capture:
    if: github.event.pull_request.head.ref == 'feature/first-visit-assembly'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        run: npm run build

      - name: Install Chromium capture tools
        working-directory: site
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture timed desktop and mobile frames
        working-directory: site
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/wievien-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4321/ > /dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:4321/ > /dev/null

          cat > .capture-intro.mjs <<'JS'
          import { chromium } from 'playwright';
          import { mkdir, writeFile } from 'node:fs/promises';

          const output = '/tmp/intro-filmstrip';
          await mkdir(output, { recursive: true });

          const viewports = [
            { name: 'desktop', width: 1440, height: 1000, mobile: false },
            { name: 'mobile', width: 390, height: 844, mobile: true },
          ];

          const marks = [50, 500, 1000, 1500, 2200, 2900, 3600, 4300, 5000, 5700, 6300, 6900, 7600, 8400];
          const browser = await chromium.launch({ headless: true });
          const report = {};

          try {
            for (const viewport of viewports) {
              const context = await browser.newContext({
                viewport: { width: viewport.width, height: viewport.height },
                deviceScaleFactor: 1,
                isMobile: viewport.mobile,
                hasTouch: viewport.mobile,
                reducedMotion: 'no-preference',
              });
              const page = await context.newPage();
              const errors = [];
              page.on('pageerror', (error) => errors.push(`pageerror: ${error.message}`));
              page.on('console', (message) => {
                if (message.type() === 'error' || message.type() === 'warning') {
                  errors.push(`${message.type()}: ${message.text()}`);
                }
              });

              await page.goto(`http://127.0.0.1:4321/?intro=1&film=${viewport.name}`, {
                waitUntil: 'domcontentloaded',
              });
              await page.waitForFunction(
                () => document.documentElement.dataset.assembly === 'playing',
                null,
                { timeout: 6000 },
              );

              report[viewport.name] = { frames: [], errors };
              let elapsed = 0;
              for (const mark of marks) {
                await page.waitForTimeout(Math.max(0, mark - elapsed));
                elapsed = mark;

                report[viewport.name].frames.push(await page.evaluate((timestamp) => ({
                  timestamp,
                  assembly: document.documentElement.dataset.assembly ?? null,
                  titleLayers: document.querySelectorAll('.title-motion-layer').length,
                  studioComplete: document.querySelector('[data-assemble="studio"]')?.getAttribute('data-title-entrance'),
                  wordComplete: document.querySelector('[data-assemble="wievien"]')?.getAttribute('data-title-entrance'),
                  visibleGlyphs: [...document.querySelectorAll('.title-motion-wievien .title-motion-glyph')].filter((element) => {
                    const style = getComputedStyle(element);
                    return style.visibility !== 'hidden' && Number(style.opacity) > 0.01;
                  }).length,
                  visibleCasts: [...document.querySelectorAll('.title-motion-wievien .title-motion-cast')].filter((element) => Number(getComputedStyle(element).opacity) > 0.01).length,
                }), mark));

                await page.screenshot({
                  path: `${output}/${viewport.name}-${String(mark).padStart(4, '0')}.png`,
                  fullPage: false,
                  animations: 'allow',
                });
              }

              await context.close();
            }
          } finally {
            await browser.close();
          }

          await writeFile(`${output}/report.json`, JSON.stringify(report, null, 2));
          JS

          node .capture-intro.mjs
          rm .capture-intro.mjs

      - name: Upload filmstrip
        uses: actions/upload-artifact@v4
        with:
          name: intro-filmstrip
          path: /tmp/intro-filmstrip
          if-no-files-found: error
          retention-days: 3
