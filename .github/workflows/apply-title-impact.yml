name: Apply title impact polish

on:
  push:
    branches:
      - feature/first-visit-assembly
    paths:
      - 'site/.title-impact-trigger'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest

    steps:
      - name: Check out intro branch
        uses: actions/checkout@v4
        with:
          ref: feature/first-visit-assembly
          fetch-depth: 0

      - name: Apply verified title edits
        run: python3 .github/scripts/apply-title-impact.py

      - name: Commit impact polish
        run: |
          git config user.name 'Studio Wievien motion bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Give the title impacts visible weight'
          git push origin HEAD:feature/first-visit-assembly
