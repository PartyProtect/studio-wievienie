name: Intro contract v2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'site/**'
      - '.github/workflows/intro-contract-v2.yml'

permissions:
  contents: read

jobs:
  contract:
    if: github.event.pull_request.head.ref == 'feature/first-visit-assembly'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install and build
        working-directory: site
        run: |
          npm ci
          npm run build
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run browser contract
        working-directory: site
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/wievien-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT

          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:4321/ > /dev/null && break
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:4321/ > /dev/null

          cat > .intro-contract-v2.mjs <<'JS'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          import { mkdir, writeFile } from 'node:fs/promises';

          const origin = 'http://127.0.0.1:4321';
          const output = '/tmp/intro-contract-v2';
          await mkdir(output, { recursive: true });
          const report = { scenarios: [] };
          const browser = await chromium.launch({ headless: true });

          const captureErrors = (page) => {
            const errors = [];
            page.on('pageerror', (error) => errors.push(`pageerror: ${error.message}`));
            page.on('console', (message) => {
              if (message.type() === 'error') errors.push(`console: ${message.text()}`);
            });
            return errors;
          };

          const snapshot = (page) => page.evaluate(() => {
            const root = document.documentElement;
            const studio = document.querySelector('[data-assemble="studio"]');
            const wievien = document.querySelector('[data-assemble="wievien"]');
            const layers = [...document.querySelectorAll('.title-motion-layer')];
            return {
              assembly: root.dataset.assembly ?? null,
              heading: document.querySelector('#hero-title')?.textContent?.replace(/\s+/g, ' ').trim() ?? null,
              studioVisibility: studio ? getComputedStyle(studio).visibility : null,
              studioOpacity: studio ? Number(getComputedStyle(studio).opacity) : null,
              wievienVisibility: wievien ? getComputedStyle(wievien).visibility : null,
              wievienOpacity: wievien ? Number(getComputedStyle(wievien).opacity) : null,
              motionLayers: layers.length,
              layersDecorative: layers.every((element) => element.getAttribute('aria-hidden') === 'true'),
              overflow: root.scrollWidth - root.clientWidth,
              seen: sessionStorage.getItem('studio-wievien-assembly-seen'),
            };
          });

          const assertStatic = async (page, label) => {
            const state = await snapshot(page);
            assert.equal(state.heading, 'Studio Wievien', `${label}: heading text`);
            assert.equal(state.studioVisibility, 'visible', `${label}: Studio visibility`);
            assert.equal(state.wievienVisibility, 'visible', `${label}: Wievien visibility`);
            assert.ok(state.studioOpacity > 0.99, `${label}: Studio opacity ${state.studioOpacity}`);
            assert.ok(state.wievienOpacity > 0.99, `${label}: Wievien opacity ${state.wievienOpacity}`);
            assert.equal(state.motionLayers, 0, `${label}: temporary layers ${state.motionLayers}`);
            assert.ok(state.overflow <= 1, `${label}: horizontal overflow ${state.overflow}px`);
            return state;
          };

          const run = async (name, fn) => {
            const row = { name, passed: false };
            report.scenarios.push(row);
            try {
              row.details = await fn();
              row.passed = true;
              console.log(`PASS ${name}`);
            } catch (error) {
              row.error = error instanceof Error ? error.stack : String(error);
              console.error(`FAIL ${name}: ${row.error}`);
              throw error;
            } finally {
              await writeFile(`${output}/report.json`, JSON.stringify(report, null, 2));
            }
          };

          try {
            await run('forced intro stays semantic and decorative', async () => {
              const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
              const page = await context.newPage();
              const errors = captureErrors(page);
              await page.goto(`${origin}/?intro=1&contract=semantic`, { waitUntil: 'domcontentloaded' });
              await page.waitForFunction(() => document.documentElement.dataset.assembly === 'playing');
              await page.waitForSelector('.title-motion-layer');
              const state = await snapshot(page);
              assert.equal(state.heading, 'Studio Wievien', 'semantic: real heading remains authored');
              assert.equal(state.studioVisibility, 'visible', 'semantic: Studio remains in accessibility tree');
              assert.equal(state.wievienVisibility, 'visible', 'semantic: Wievien remains in accessibility tree');
              assert.equal(state.layersDecorative, true, 'semantic: visual clones are aria-hidden');
              assert.ok(state.overflow <= 1, `semantic: horizontal overflow ${state.overflow}px`);
              assert.deepEqual(errors, [], `semantic: browser errors ${errors.join(' | ')}`);
              await context.close();
              return state;
            });

            await run('wheel dismisses immediately', async () => {
              const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
              const page = await context.newPage();
              const errors = captureErrors(page);
              await page.goto(`${origin}/?intro=1&contract=wheel`, { waitUntil: 'domcontentloaded' });
              await page.waitForFunction(() => document.documentElement.dataset.assembly === 'playing');
              await page.waitForSelector('.title-motion-layer');
              await page.waitForTimeout(1100);
              await page.mouse.wheel(0, 260);
              await page.waitForFunction(() => document.documentElement.dataset.assembly !== 'playing', null, { timeout: 2500 });
              await page.waitForFunction(() => !document.querySelector('.title-motion-layer'), null, { timeout: 2500 });
              const state = await assertStatic(page, 'wheel');
              assert.deepEqual(errors, [], `wheel: browser errors ${errors.join(' | ')}`);
              await context.close();
              return state;
            });

            await run('complete performance cleans up and repeat visit stays static', async () => {
              const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
              const page = await context.newPage();
              const errors = captureErrors(page);
              await page.goto(`${origin}/?intro=1&contract=complete`, { waitUntil: 'domcontentloaded' });
              await page.waitForFunction(() => document.documentElement.dataset.assembly === 'playing');
              await page.waitForFunction(() => document.documentElement.dataset.assembly !== 'playing', null, { timeout: 13000 });
              await page.waitForTimeout(300);
              const completed = await assertStatic(page, 'complete');
              await page.goto(`${origin}/?contract=repeat`, { waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(500);
              assert.notEqual(await page.evaluate(() => document.documentElement.dataset.assembly), 'playing', 'repeat: intro replayed');
              const repeat = await assertStatic(page, 'repeat');
              assert.deepEqual(errors, [], `complete: browser errors ${errors.join(' | ')}`);
              await context.close();
              return { completed, repeat };
            });

            await run('reduced motion is static even when replay is requested', async () => {
              const context = await browser.newContext({
                viewport: { width: 390, height: 844 },
                isMobile: true,
                hasTouch: true,
                reducedMotion: 'reduce',
              });
              const page = await context.newPage();
              const errors = captureErrors(page);
              await page.goto(`${origin}/?intro=1&contract=reduced`, { waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(700);
              assert.notEqual(await page.evaluate(() => document.documentElement.dataset.assembly), 'playing', 'reduced: kinetic state active');
              const state = await assertStatic(page, 'reduced');
              assert.deepEqual(errors, [], `reduced: browser errors ${errors.join(' | ')}`);
              await context.close();
              return state;
            });

            await run('resize cancels the entire intro cleanly', async () => {
              const context = await browser.newContext({ viewport: { width: 1200, height: 850 } });
              const page = await context.newPage();
              const errors = captureErrors(page);
              await page.goto(`${origin}/?intro=1&contract=resize`, { waitUntil: 'domcontentloaded' });
              await page.waitForFunction(() => document.documentElement.dataset.assembly === 'playing');
              await page.waitForSelector('.title-motion-layer');
              await page.waitForTimeout(900);
              await page.setViewportSize({ width: 980, height: 760 });
              await page.waitForFunction(() => document.documentElement.dataset.assembly !== 'playing', null, { timeout: 2500 });
              await page.waitForFunction(() => !document.querySelector('.title-motion-layer'), null, { timeout: 2500 });
              const state = await assertStatic(page, 'resize');
              assert.deepEqual(errors, [], `resize: browser errors ${errors.join(' | ')}`);
              await context.close();
              return state;
            });

            await run('JavaScript-disabled mobile page remains complete and navigable', async () => {
              const context = await browser.newContext({
                viewport: { width: 390, height: 844 },
                isMobile: true,
                hasTouch: true,
                javaScriptEnabled: false,
              });
              const page = await context.newPage();
              await page.goto(`${origin}/?contract=no-js`, { waitUntil: 'domcontentloaded' });
              const state = await assertStatic(page, 'no-js');
              const hasVisibleWorkLink = await page.locator('a[href="/werk/"]').evaluateAll((links) => links.some((link) => {
                const style = getComputedStyle(link);
                const rect = link.getBoundingClientRect();
                return style.display !== 'none' && style.visibility !== 'hidden' && Number(style.opacity) > 0 && rect.width > 0 && rect.height > 0;
              }));
              assert.equal(hasVisibleWorkLink, true, 'no-js: no visible Werk link');
              await context.close();
              return state;
            });
          } catch (error) {
            report.failure = error instanceof Error ? error.stack : String(error);
            await writeFile(`${output}/report.json`, JSON.stringify(report, null, 2));
            throw error;
          } finally {
            await browser.close();
          }
          JS

          node .intro-contract-v2.mjs
          rm .intro-contract-v2.mjs

      - name: Upload contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intro-contract-v2
          path: /tmp/intro-contract-v2
          if-no-files-found: error
          retention-days: 3
