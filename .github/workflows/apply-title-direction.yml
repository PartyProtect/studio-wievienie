name: Apply title direction

on:
  push:
    branches:
      - feature/first-visit-assembly
    paths:
      - 'site/.title-direction-trigger'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest

    steps:
      - name: Check out intro branch
        uses: actions/checkout@v4
        with:
          ref: feature/first-visit-assembly
          fetch-depth: 0

      - name: Apply verified motion-direction edits
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          title_path = Path('site/src/scripts/title-entrance.js')
          title = title_path.read_text()

          title = replace_once(
              title,
              "      const direction = index % 2 === 0 ? -1 : 1;",
              "      const direction = -1;",
              'one-way compression',
          )
          title = replace_once(
              title,
              "          { offset: 0.3, transform: `translate(${direction * force}px, -1px) rotate(${direction * force * 0.1}deg)` },",
              "          { offset: 0.28, transform: `translate(${direction * force}px, ${-Math.min(3.4, 0.8 + force * 0.18)}px) rotate(${direction * force * 0.085}deg) scale(${1 + force * 0.004}, ${1 - force * 0.006})` },",
              'impact pose',
          )
          title = replace_once(
              title,
              "          { offset: 0.64, transform: `translate(${direction * -force * 0.24}px, 0) rotate(${direction * -force * 0.026}deg)` },",
              "          { offset: 0.66, transform: `translate(${direction * -force * 0.24}px, 0.6px) rotate(${direction * -force * 0.026}deg) scale(.996, 1.006)` },",
              'impact rebound',
          )

          title = replace_once(
              title,
              "      point(0, -67 * vw, 0.8 * vh, 0, -7, 0.97, 1, 1.45),\n      point(0.56, 1.9 * vw, 0.15 * vh, 0, 1.8, 1.025, 0.93, 0.55),\n      point(0.72, -0.85 * vw, -0.08 * vh, 0, -0.9, 0.992, 1.025, 0.2),\n      point(0.86, 0.28 * vw, 0.03 * vh, 0, 0.32, 1.004, 0.99, 0.08),",
              "      point(0, -46 * vw, 0.45 * vh, 0, -5.5, 0.975, 1, 1.2),\n      point(0.54, 1.55 * vw, 0.12 * vh, 0, 1.45, 1.022, 0.94, 0.48),\n      point(0.72, -0.68 * vw, -0.06 * vh, 0, -0.72, 0.994, 1.02, 0.18),\n      point(0.87, 0.22 * vw, 0.02 * vh, 0, 0.24, 1.003, 0.992, 0.06),",
              'Studio path',
          )
          title = replace_once(
              title,
              "    const options = { delay: 180, duration: 1160, easing: 'cubic-bezier(.16,.78,.2,1)' };",
              "    const options = { delay: 70, duration: 980, easing: 'cubic-bezier(.14,.82,.18,1)' };",
              'Studio timing',
          )
          title = replace_once(title, "    }, 1430);", "    }, 1110);", 'Studio handoff')

          title = replace_once(
              title,
              "        point(0, -54 * vw, 0.4 * vh, 0, -11, 0.95, 1, 1.25, 0.22),\n        point(0.16, -44 * vw, -0.9 * vh, 1.2 * vh, 6, 0.97, 0.98, 0.95, 0.24),\n        point(0.31, -34 * vw, 0.3 * vh, 0, -6.5, 0.98, 0.97, 0.82, 0.76),\n        point(0.46, -24 * vw, -0.75 * vh, 1 * vh, 5.5, 0.985, 0.985, 0.66, 0.24),\n        point(0.61, -14 * vw, 0.2 * vh, 0, -4.5, 0.992, 0.975, 0.45, 0.76),\n        point(0.76, -6 * vw, -0.45 * vh, 0.6 * vh, 3.2, 0.998, 0.99, 0.25, 0.24),\n        point(0.9, -1.1 * vw, 0, 0, -1, 1.018, 0.93, 0.18, 0.76),",
              "        point(0, -38 * vw, 0.35 * vh, 0, -12, 0.95, 1, 1.25, 0.22),\n        point(0.16, -30 * vw, -0.9 * vh, 1.2 * vh, 7, 0.97, 0.98, 0.95, 0.24),\n        point(0.31, -22 * vw, 0.3 * vh, 0, -7, 0.98, 0.97, 0.82, 0.76),\n        point(0.46, -14 * vw, -0.75 * vh, 1 * vh, 6, 0.985, 0.985, 0.66, 0.24),\n        point(0.61, -7 * vw, 0.2 * vh, 0, -4.8, 0.992, 0.975, 0.45, 0.76),\n        point(0.76, -2.4 * vw, -0.45 * vh, 0.6 * vh, 3.4, 0.998, 0.99, 0.25, 0.24),\n        point(0.9, -0.45 * vw, 0, 0, -1.1, 1.025, 0.91, 0.2, 0.76),",
              'W path',
          )

          title = replace_once(
              title,
              "      { delay: 1700, duration: 1500, easing: 'linear', shadowLead: 0 },\n      { delay: 3280, duration: 720, easing: 'cubic-bezier(.16,.88,.22,1)', shadowLead: 150 },\n      { delay: 3620, duration: 920, easing: 'cubic-bezier(.2,.72,.18,1)', shadowLead: 90 },\n      { delay: 4700, duration: 1040, easing: 'cubic-bezier(.14,.84,.22,1)', shadowLead: 260 },\n      { delay: 5650, duration: 640, easing: 'cubic-bezier(.17,.86,.25,1)', shadowLead: 120 },\n      { delay: 5870, duration: 840, easing: 'cubic-bezier(.2,.78,.2,1)', shadowLead: 150 },\n      { delay: 6500, duration: 900, easing: 'cubic-bezier(.1,.76,.18,1)', shadowLead: 140 },",
              "      { delay: 1320, duration: 1380, easing: 'linear', shadowLead: 0 },\n      { delay: 2780, duration: 700, easing: 'cubic-bezier(.16,.88,.22,1)', shadowLead: 150 },\n      { delay: 3100, duration: 900, easing: 'cubic-bezier(.2,.72,.18,1)', shadowLead: 90 },\n      { delay: 4140, duration: 1020, easing: 'cubic-bezier(.14,.84,.22,1)', shadowLead: 300 },\n      { delay: 5120, duration: 620, easing: 'cubic-bezier(.17,.86,.25,1)', shadowLead: 120 },\n      { delay: 5340, duration: 820, easing: 'cubic-bezier(.2,.78,.2,1)', shadowLead: 150 },\n      { delay: 5960, duration: 900, easing: 'cubic-bezier(.1,.76,.18,1)', shadowLead: 180 },",
              'name score',
          )

          title = replace_once(
              title,
              "      reactToImpact(scene, [2, 1, 0], (index, order) => 4 - order, 320, 28);\n    }, 5350);",
              "      reactToImpact(scene, [2, 1, 0], (index, order) => 9 - order * 1.7, 430, 42);\n    }, 4770);",
              'v impact',
          )
          title = replace_once(
              title,
              "      reactToImpact(scene, [5, 4, 3, 2, 1, 0], (index, order) => Math.max(1.2, 7 - order * 0.9), 330, 34);\n    }, 7050);",
              "      reactToImpact(scene, [5, 4, 3, 2, 1, 0], (index, order) => Math.max(3, 12.5 - order * 1.65), 460, 40);\n    }, 6470);",
              'n collision',
          )
          title = replace_once(title, "    }, 7450);", "    }, 7130);", 'collective settle')
          title = replace_once(title, "    }, 7680);", "    }, 7470);", 'title handoff')
          title = replace_once(title, "      setCompletionTimer(10700);", "      setCompletionTimer(9400);", 'completion timer')
          title_path.write_text(title)

          css_path = Path('site/src/styles/title-entrance.css')
          css = css_path.read_text()
          replacements = [
              ('  color: rgb(23 23 22 / 0.11);', '  color: rgb(23 23 22 / 0.13);', 'cast density'),
              ('  filter: blur(4.6px);', '  filter: blur(5.3px);', 'cast softness'),
              ('  background: rgb(23 23 22 / 0.34);', '  background: rgb(23 23 22 / 0.46);', 'contact density'),
              ('  filter: blur(5.5px);', '  filter: blur(4.4px);', 'contact sharpness'),
              ("animation: assembly-small-settle 500ms 7480ms", "animation: assembly-small-settle 500ms 7750ms", 'header reveal'),
              ("animation: title-image-frame-in 1120ms 7700ms", "animation: title-image-frame-in 1120ms 7650ms", 'image frame reveal'),
              ("animation: title-image-content-in 1280ms 7700ms", "animation: title-image-content-in 1280ms 7650ms", 'image content reveal'),
              ("[data-assemble='guides'] { animation-delay: 7500ms", "[data-assemble='guides'] { animation-delay: 7520ms", 'guide reveal'),
              ("assembly-guide-top { animation-delay: 7540ms", "assembly-guide-top { animation-delay: 7560ms", 'top guide'),
              ("assembly-guide-right { animation-delay: 7720ms", "assembly-guide-right { animation-delay: 7740ms", 'right guide'),
              ("assembly-guide-cross { animation-delay: 7900ms", "assembly-guide-cross { animation-delay: 7920ms", 'cross guide'),
              ("[data-assemble='fields'] { animation-delay: 7880ms", "[data-assemble='fields'] { animation-delay: 7840ms", 'fields reveal'),
              ("[data-assemble='cta'] { animation-delay: 8120ms", "[data-assemble='cta'] { animation-delay: 8060ms", 'cta reveal'),
              ("[data-assemble='caption'] { animation-delay: 8160ms", "[data-assemble='caption'] { animation-delay: 8100ms", 'caption reveal'),
              ("[data-assemble='index'] { animation-delay: 8300ms", "[data-assemble='index'] { animation-delay: 8240ms", 'index reveal'),
              ("nth-child(1) { animation-delay: 8420ms", "nth-child(1) { animation-delay: 8360ms", 'door one'),
              ("nth-child(2) { animation-delay: 8550ms", "nth-child(2) { animation-delay: 8470ms", 'door two'),
              ("nth-child(3) { animation-delay: 8680ms", "nth-child(3) { animation-delay: 8580ms", 'door three'),
              ("nth-child(4) { animation-delay: 8810ms", "nth-child(4) { animation-delay: 8690ms", 'door four'),
          ]
          for old, new, label in replacements:
              css = replace_once(css, old, new, label)
          css_path.write_text(css)

          Path('site/.title-direction-trigger').unlink()
          Path('.github/workflows/apply-title-direction.yml').unlink()
          PY

      - name: Commit tuned title
        run: |
          git config user.name 'Studio Wievien motion bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Direct the title entrance around two real impacts'
          git push origin HEAD:feature/first-visit-assembly
