name: Apply title impact polish

on:
  push:
    branches:
      - feature/first-visit-assembly
    paths:
      - 'site/.title-impact-trigger'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest

    steps:
      - name: Check out intro branch
        uses: actions/checkout@v4
        with:
          ref: feature/first-visit-assembly
          fetch-depth: 0

      - name: Strengthen impacts and shadows
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          title_path = Path('site/src/scripts/title-entrance.js')
          title = title_path.read_text()

          old_reaction = '''  const reactToImpact = (scene, indexes, strength, duration, step) => {
    indexes.forEach((index, order) => {
      const direction = -1;
      const force = strength(index, order);
      const delay = order * step;

      runtime.playFrames(
        scene.glyphs[index],
        [
          { transform: 'none' },
          { offset: 0.28, transform: `translate(${direction * force}px, ${-Math.min(3.4, 0.8 + force * 0.18)}px) rotate(${direction * force * 0.085}deg) scale(${1 + force * 0.004}, ${1 - force * 0.006})` },
          { offset: 0.66, transform: `translate(${direction * -force * 0.24}px, 0.6px) rotate(${direction * -force * 0.026}deg) scale(.996, 1.006)` },
          { transform: 'none' },
        ],
        { duration, delay, easing: 'cubic-bezier(.18,.82,.2,1)', fill: 'both' },
      );

      runtime.playFrames(
        scene.casts[index],
        [
          { transform: 'none', opacity: 0.18 },
          { offset: 0.3, transform: `translate(${direction * force * 1.15}px, 2px) skewX(${direction * 7}deg) scale(1.08, 0.76)`, opacity: 0.28 },
          { transform: 'none', opacity: 0.18 },
        ],
        { duration, delay, easing: 'cubic-bezier(.18,.82,.2,1)', fill: 'both' },
      );

      runtime.playFrames(
        scene.contacts[index],
        [
          { transform: 'none', opacity: 0.16 },
          { offset: 0.3, transform: `translateX(${direction * force * 0.65}px) scaleX(1.35) scaleY(.58)`, opacity: 0.33 },
          { transform: 'none', opacity: 0.16 },
        ],
        { duration, delay, easing: 'ease-out', fill: 'both' },
      );
    });
  };'''

          new_reaction = '''  const reactToImpact = (scene, indexes, strength, duration, step) => {
    indexes.forEach((index, order) => {
      const direction = -1;
      const force = strength(index, order);
      const delay = order * step;
      const lift = Math.min(7.5, 1.4 + force * 0.28);
      const squeezeX = 1 + force * 0.0065;
      const squeezeY = Math.max(0.82, 1 - force * 0.0105);

      runtime.playFrames(
        scene.glyphs[index],
        [
          { transform: 'none' },
          {
            offset: 0.22,
            transform: `translate(${direction * force}px, ${-lift}px) rotate(${direction * force * 0.09}deg) scale(${squeezeX}, ${squeezeY})`,
          },
          {
            offset: 0.48,
            transform: `translate(${direction * force * 0.55}px, ${lift * 0.24}px) rotate(${direction * force * 0.045}deg) scale(.985, 1.03)`,
          },
          {
            offset: 0.72,
            transform: `translate(${direction * -force * 0.22}px, -0.4px) rotate(${direction * -force * 0.022}deg) scale(1.006, .992)`,
          },
          { transform: 'none' },
        ],
        { duration, delay, easing: 'cubic-bezier(.14,.8,.18,1)', fill: 'both' },
      );

      runtime.playFrames(
        scene.casts[index],
        [
          { transform: 'none', opacity: 0.18 },
          {
            offset: 0.22,
            transform: `translate(${direction * force * 1.35}px, 3px) skewX(${direction * 12}deg) scale(1.24, .63)`,
            opacity: 0.36,
          },
          {
            offset: 0.52,
            transform: `translate(${direction * force * 0.5}px, 1px) skewX(${direction * 4}deg) scale(.92, 1.04)`,
            opacity: 0.21,
          },
          { transform: 'none', opacity: 0.18 },
        ],
        { duration, delay, easing: 'cubic-bezier(.14,.8,.18,1)', fill: 'both' },
      );

      runtime.playFrames(
        scene.contacts[index],
        [
          { transform: 'none', opacity: 0.18 },
          {
            offset: 0.2,
            transform: `translateX(${direction * force * 0.72}px) scaleX(${1.55 + force * 0.025}) scaleY(.43)`,
            opacity: 0.46,
          },
          {
            offset: 0.5,
            transform: `translateX(${direction * force * 0.22}px) scaleX(.88) scaleY(.92)`,
            opacity: 0.2,
          },
          { transform: 'none', opacity: 0.18 },
        ],
        { duration, delay, easing: 'ease-out', fill: 'both' },
      );
    });
  };'''
          title = replace_once(title, old_reaction, new_reaction, 'impact engine')

          old_w = '''        point(0, -38 * vw, 0.35 * vh, 0, -12, 0.95, 1, 1.25, 0.22),
        point(0.16, -30 * vw, -0.9 * vh, 1.2 * vh, 7, 0.97, 0.98, 0.95, 0.24),
        point(0.31, -22 * vw, 0.3 * vh, 0, -7, 0.98, 0.97, 0.82, 0.76),
        point(0.46, -14 * vw, -0.75 * vh, 1 * vh, 6, 0.985, 0.985, 0.66, 0.24),
        point(0.61, -7 * vw, 0.2 * vh, 0, -4.8, 0.992, 0.975, 0.45, 0.76),
        point(0.76, -2.4 * vw, -0.45 * vh, 0.6 * vh, 3.4, 0.998, 0.99, 0.25, 0.24),
        point(0.9, -0.45 * vw, 0, 0, -1.1, 1.025, 0.91, 0.2, 0.76),'''
          new_w = '''        point(0, -28 * vw, 0.25 * vh, 0, -12, 0.95, 1, 1.18, 0.22),
        point(0.16, -22 * vw, -0.9 * vh, 1.2 * vh, 7.5, 0.97, 0.98, 0.9, 0.24),
        point(0.31, -16 * vw, 0.3 * vh, 0, -7.5, 0.98, 0.97, 0.75, 0.76),
        point(0.46, -10 * vw, -0.75 * vh, 1 * vh, 6.5, 0.985, 0.985, 0.58, 0.24),
        point(0.61, -5 * vw, 0.2 * vh, 0, -5.2, 0.992, 0.975, 0.38, 0.76),
        point(0.76, -1.55 * vw, -0.45 * vh, 0.6 * vh, 3.7, 0.998, 0.99, 0.2, 0.24),
        point(0.9, -0.28 * vw, 0, 0, -1.2, 1.03, 0.9, 0.17, 0.76),'''
          title = replace_once(title, old_w, new_w, 'W staging')

          title = replace_once(
              title,
              "      { delay: 1320, duration: 1380, easing: 'linear', shadowLead: 0 },",
              "      { delay: 1260, duration: 1360, easing: 'linear', shadowLead: 0 },",
              'W timing',
          )
          title = replace_once(
              title,
              "      reactToImpact(scene, [2, 1, 0], (index, order) => 9 - order * 1.7, 430, 42);\n    }, 4770);",
              "      reactToImpact(scene, [2, 1, 0], (index, order) => 18 - order * 3.4, 540, 48);\n    }, 4770);",
              'v impact force',
          )
          title = replace_once(
              title,
              "      reactToImpact(scene, [5, 4, 3, 2, 1, 0], (index, order) => Math.max(3, 12.5 - order * 1.65), 460, 40);\n    }, 6470);",
              "      reactToImpact(scene, [5, 4, 3, 2, 1, 0], (index, order) => Math.max(5, 22 - order * 3.25), 560, 46);\n    }, 6470);",
              'n impact force',
          )
          title = replace_once(title, "    }, 7130);", "    }, 7290);", 'collective settle')
          title = replace_once(title, "    }, 7470);", "    }, 7730);", 'title handoff')
          title = replace_once(title, "      setCompletionTimer(9400);", "      setCompletionTimer(9700);", 'completion timer')
          title_path.write_text(title)

          css_path = Path('site/src/styles/title-entrance.css')
          css = css_path.read_text()
          replacements = [
              ('  color: rgb(23 23 22 / 0.13);', '  color: rgb(23 23 22 / 0.15);', 'cast density'),
              ('  filter: blur(5.3px);', '  filter: blur(5.8px);', 'cast softness'),
              ('  background: rgb(23 23 22 / 0.46);', '  background: rgb(23 23 22 / 0.54);', 'contact density'),
              ('  filter: blur(4.4px);', '  filter: blur(3.9px);', 'contact sharpness'),
              ("animation: assembly-small-settle 500ms 7750ms", "animation: assembly-small-settle 500ms 8050ms", 'header reveal'),
              ("animation: title-image-frame-in 1120ms 7650ms", "animation: title-image-frame-in 1120ms 7900ms", 'image frame reveal'),
              ("animation: title-image-content-in 1280ms 7650ms", "animation: title-image-content-in 1280ms 7900ms", 'image content reveal'),
              ("[data-assemble='guides'] { animation-delay: 7520ms", "[data-assemble='guides'] { animation-delay: 7770ms", 'guide reveal'),
              ("assembly-guide-top { animation-delay: 7560ms", "assembly-guide-top { animation-delay: 7810ms", 'top guide'),
              ("assembly-guide-right { animation-delay: 7740ms", "assembly-guide-right { animation-delay: 7990ms", 'right guide'),
              ("assembly-guide-cross { animation-delay: 7920ms", "assembly-guide-cross { animation-delay: 8170ms", 'cross guide'),
              ("[data-assemble='fields'] { animation-delay: 7840ms", "[data-assemble='fields'] { animation-delay: 8100ms", 'fields reveal'),
              ("[data-assemble='cta'] { animation-delay: 8060ms", "[data-assemble='cta'] { animation-delay: 8320ms", 'cta reveal'),
              ("[data-assemble='caption'] { animation-delay: 8100ms", "[data-assemble='caption'] { animation-delay: 8360ms", 'caption reveal'),
              ("[data-assemble='index'] { animation-delay: 8240ms", "[data-assemble='index'] { animation-delay: 8500ms", 'index reveal'),
              ("nth-child(1) { animation-delay: 8360ms", "nth-child(1) { animation-delay: 8620ms", 'door one'),
              ("nth-child(2) { animation-delay: 8470ms", "nth-child(2) { animation-delay: 8730ms", 'door two'),
              ("nth-child(3) { animation-delay: 8580ms", "nth-child(3) { animation-delay: 8840ms", 'door three'),
              ("nth-child(4) { animation-delay: 8690ms", "nth-child(4) { animation-delay: 8950ms", 'door four'),
          ]
          for old, new, label in replacements:
              css = replace_once(css, old, new, label)
          css_path.write_text(css)

          Path('site/.title-impact-trigger').unlink()
          Path('.github/workflows/apply-title-impact.yml').unlink()
          PY

      - name: Commit impact polish
        run: |
          git config user.name 'Studio Wievien motion bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Give the title impacts visible weight'
          git push origin HEAD:feature/first-visit-assembly
